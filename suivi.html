<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de la comptabilité</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <button id="bouton-menu" class="bouton-hamburger" aria-label="Menu">☰</button>
    <div class="titre">
      <img class="logo" src="assets/logo-rockets.png" alt="Logo Rockets de Princeville">
      <div class="textes">
        <h1>Comptabilité du club</h1>
        <span id="entete-utilisateur"></span>
      </div>
    </div>
    <div class="zone-droite">
      <button id="bouton-deconnexion">Déconnexion</button>
    </div>
  </header>

  <div class="corps-page">
    <aside class="barre-laterale" id="barre-laterale">
      <nav>
        <a href="nouvelle-demande.html">Nouvelle demande</a>
        <a href="suivi.html" data-role-requise="comptable">Suivi</a>
        <a href="gestion.html" data-role-requise="comptable">Gestion</a>
      </nav>
    </aside>
    <div class="contenu-principal">
      <main>
    <div class="carte">
      <h2>Suivi des demandes</h2>
      <p class="aide" id="ligne-solde-initial"></p>
      <table class="demandes">
        <thead>
          <tr>
            <th>Date</th>
            <th>Personne</th>
            <th>Montant</th>
            <th>Solde</th>
            <th>Catégorie</th>
            <th>Statut</th>
            <th>Pièce jointe</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
      </table>
      <p id="message-vide" class="aide" style="display:none">Aucune demande pour l'instant.</p>
    </div>
  </main>
    </div>
  </div>

  <!-- Fenêtre modale d'approbation -->
  <div id="modale-approbation" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
    <div class="carte" style="width:380px;">
      <h2>Approuver la demande</h2>
      <p id="modale-resume" class="aide"></p>
      <p id="modale-alerte-specimen" class="erreur"></p>

      <label for="modale-categorie">Catégorie</label>
      <select id="modale-categorie" required></select>

      <p class="erreur" id="modale-erreur"></p>

      <button class="bouton" id="modale-confirmer">Approuver et envoyer le courriel</button>
      <button class="bouton secondaire" id="modale-annuler">Annuler</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/suivi.js"></script>
</body>
</html>
