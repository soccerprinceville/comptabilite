<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi de la comptabilité</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <button id="bouton-menu" class="bouton-hamburger" aria-label="Menu">☰</button>
    <div class="titre">
      <img class="logo" src="assets/logo-rockets.png" alt="Logo Rockets de Princeville">
      <div class="textes">
        <h1>Comptabilité du club</h1>
        <span id="entete-utilisateur"></span>
      </div>
    </div>
  </header>

  <div class="corps-page">
    <aside class="barre-laterale" id="barre-laterale">
      <nav>
        <a href="nouvelle-demande.html"><span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg></span><span class="texte">Nouvelle demande</span></a>
        <a href="suivi.html" data-role-requise="comptable"><span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span><span class="texte">Suivi</span></a>
        <a href="gestion.html" data-role-requise="comptable"><span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span><span class="texte">Gestion</span></a>
      </nav>
      <button id="bouton-deconnexion" class="lien-deconnexion"><span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></span><span class="texte">Déconnexion</span></button>
    </aside>
    <div class="contenu-principal">
      <main>
    <div class="carte">
      <h2>Suivi des demandes et transactions</h2>

      <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;">
        <div style="flex:1;min-width:160px;">
          <label for="filtre-compte">Compte</label>
          <select id="filtre-compte"></select>
        </div>
        <div style="flex:1;min-width:120px;">
          <label for="filtre-annee">Année</label>
          <select id="filtre-annee"></select>
        </div>
        <div>
          <button type="button" class="bouton" id="bouton-nouvelle-transaction" style="margin-top:0;">+ Transaction manuelle</button>
        </div>
      </div>

      <p class="aide" id="ligne-solde-initial"></p>

      <table class="demandes">
        <thead>
          <tr>
            <th></th>
            <th>Date</th>
            <th>Personne / description</th>
            <th>Montant</th>
            <th>Solde</th>
            <th>Catégorie</th>
            <th>Statut</th>
            <th></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="corps-tableau"></tbody>
      </table>
      <p id="message-vide" class="aide" style="display:none">Aucune demande ni transaction pour ce compte/année.</p>
    </div>
      </main>
    </div>
  </div>

  <!-- Fenêtre modale d'approbation d'une demande -->
  <div id="modale-approbation" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
    <div class="carte" style="width:380px;">
      <h2>Approuver la demande</h2>
      <p id="modale-resume" class="aide"></p>
      <p id="modale-alerte-specimen" class="erreur"></p>

      <label for="modale-categorie">Catégorie</label>
      <select id="modale-categorie" required></select>

      <p class="erreur" id="modale-erreur"></p>

      <button class="bouton" id="modale-confirmer">Approuver et envoyer le courriel</button>
      <button class="bouton secondaire" id="modale-annuler">Annuler</button>
    </div>
  </div>

  <!-- Fenêtre modale de transaction manuelle (ajout/modification) -->
  <div id="modale-transaction" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;">
    <div class="carte" style="width:380px;">
      <h2 id="modale-transaction-titre">Nouvelle transaction</h2>

      <label>Type</label>
      <select id="transaction-type">
        <option value="revenu">Revenu (entrée d'argent)</option>
        <option value="depense">Dépense (sortie d'argent)</option>
      </select>

      <label for="transaction-description">Description</label>
      <input type="text" id="transaction-description" placeholder="Ex. Subvention municipale">

      <label for="transaction-montant">Montant ($)</label>
      <input type="number" id="transaction-montant" step="0.01" min="0.01">

      <label for="transaction-date">Date</label>
      <input type="date" id="transaction-date">

      <label for="transaction-categorie">Catégorie</label>
      <select id="transaction-categorie"></select>

      <p class="erreur" id="transaction-erreur"></p>

      <button class="bouton" id="transaction-confirmer">Enregistrer</button>
      <button class="bouton secondaire" id="transaction-supprimer" style="display:none;">Supprimer</button>
      <button class="bouton secondaire" id="transaction-annuler">Annuler</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/suivi.js"></script>
</body>
</html>
