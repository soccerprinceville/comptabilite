<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmation de paiement — Comptabilité du club</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-connexion">

  <div class="carte" style="width:400px;text-align:center;">
    <div class="logo">
      <img src="assets/logo-rockets.png" alt="Logo Rockets de Princeville">
      <strong>Comptabilité du club</strong>
    </div>
    <div id="contenu" style="margin-top:16px;font-size:15px;">Vérification en cours…</div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script>
    (async () => {
      const contenu = document.getElementById("contenu");
      const parametres = new URLSearchParams(window.location.search);
      const id = parametres.get("id");
      const token = parametres.get("token");

      if (!id || !token) {
        contenu.textContent = "Lien invalide.";
        return;
      }

      try {
        const resultat = await appelerAppsScript("confirmerPaiement", { id, token });
        contenu.innerHTML = `✔ ${resultat.message}`;
      } catch (err) {
        contenu.textContent = "Erreur : " + err.message;
      }
    })();
  </script>
</body>
</html>
