<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvelle demande — Comptabilité du club</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="entete">
    <div class="titre">
      <img class="logo" src="assets/logo-rockets.png" alt="Logo Rockets de Princeville">
      <div class="textes">
        <h1>Comptabilité du club</h1>
        <span id="entete-utilisateur"></span>
      </div>
    </div>
    <div>
      <nav style="display:inline"><a href="dashboard.html">Accueil</a></nav>
      <button id="bouton-deconnexion">Déconnexion</button>
    </div>
  </header>

  <main>
    <div class="carte">
      <h2>Nouvelle demande de remboursement</h2>
      <form id="form-demande">
        <label for="personne">Personne à rembourser</label>
        <select id="personne" required>
          <option value="">— Choisir —</option>
        </select>
        <p class="aide">La liste est gérée par un comptable (menu Gestion).</p>

        <label for="montant">Montant ($)</label>
        <input type="number" id="montant" step="0.01" min="0.01" required>

        <label for="piece-jointe">Pièce justificative (facture, reçu…)</label>
        <input type="file" id="piece-jointe" accept=".pdf,.jpg,.jpeg,.png,.heic" required>
        <p class="aide">Le fichier sera déposé automatiquement sur le Google Drive du club.</p>

        <p class="erreur" id="message-erreur"></p>
        <p id="message-succes" style="display:none;color:#1e5c34;font-size:13px;margin-top:10px;">
          ✔ Demande envoyée avec succès.
        </p>

        <button type="submit" class="bouton" id="bouton-envoyer">Envoyer la demande</button>
      </form>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/nouvelle-demande.js"></script>
</body>
</html>
